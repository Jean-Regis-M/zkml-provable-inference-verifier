[package]
name = "zkml-prover"
version = "0.1.0"
edition = "2021"
authors = ["Applied Cryptography Team <mukizaregis26@gmail.com>"]
description = "ZK-ML Prove-Inference execution engine and Poseidon witness generator."

[dependencies]
ark-ff = "0.4.0"
ark-groth16 = "0.4.0"
ark-relations = "0.4.0"
ark-serialize = "0.4.0"
ark-std = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
poseidon-rs = { git = "https://github.com/arnaucube/poseidon-rs.git", branch = "master" }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
huggingface_hub = "0.1.0"
ureq = "2.6"
sha2 = "0.10"
